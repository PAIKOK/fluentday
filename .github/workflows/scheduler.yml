# Free scheduler: every 10 minutes, asks the backend to prepare lessons and send due reminders.
# Also keeps the free Render server awake. Needs the repository secret SCHEDULER_TOKEN (same value as on Render).
name: Reminders

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger the FluentDay scheduler
        env:
          TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SCHEDULER_TOKEN secret is not set yet; skipping."
            exit 0
          fi
          # The first try can take ~1 minute while a sleeping free server starts.
          curl --fail-with-body -sS -X POST --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer $TOKEN" https://fluentday-api.onrender.com/api/internal/run-scheduler
