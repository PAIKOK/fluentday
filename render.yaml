# Render Blueprint for the FluentDay backend (free plan). Render → New → Blueprint → pick this repo.
# Values marked `sync: false` are asked for when you create it; never commit them.
services:
  - type: web
    name: fluentday-api  # must match the address in vercel.json
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL  # your Vercel address, e.g. https://fluentday.vercel.app (no slash at the end)
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: fluentday
      - key: JWT_SECRET
        generateValue: true
      - key: SCHEDULER_TOKEN  # copy it into the GitHub secret of the same name
        generateValue: true
      - key: ADMIN_EMAILS
        value: jyothikaks023@gmail.com
      - key: TRUSTED_PROXY_HOPS  # Vercel's proxy + Render's: rate limits see each visitor's real IP
        value: "2"
      - key: SMTP_HOST  # Brevo (free); Render's free plan blocks Gmail's SMTP ports 465/587
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER  # the SMTP login from Brevo → SMTP & API
        sync: false
      - key: SMTP_PASSWORD  # the Brevo SMTP key
        sync: false
      - key: SMTP_FROM  # e.g. FluentDay <a sender address verified in Brevo>
        sync: false
